apiVersion: v1
kind: Pod
metadata:
  name: hw46-storage-pod
  namespace: hw46
spec:
  containers:
    - name: nginx
      image: nginx:1.27
      volumeMounts:
        - name: hw46-storage
          mountPath: /usr/share/nginx/html
  volumes:
    - name: hw46-storage
      persistentVolumeClaim:
        claimName: hw46-pvc
